name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.9.8"

jobs:
  lint:
    name: Ruff lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  secrets-scan:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  control-plane-tests:
    name: Control plane unit & contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit tests/contract -v

  terraform:
    name: Terraform validate & tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: Validate & lint every module
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          failed=0
          for dir in terraform/aws/*/ terraform/gcp/*/ terraform/modules/ terraform/control-plane/aws/ terraform/control-plane/gcp/; do
            # skip dirs without .tf files
            ls "$dir"*.tf >/dev/null 2>&1 || continue
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false -input=false >/dev/null \
              && terraform validate \
              && tflint --config "$GITHUB_WORKSPACE/.tflint.hcl") || failed=1
            echo "::endgroup::"
          done
          exit $failed

  terraform-plan-examples:
    name: Terraform plan on rendered example workspaces
    runs-on: ubuntu-latest
    needs: [terraform, control-plane-tests]
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,dynamodb,kms,sts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Install control plane
        working-directory: control-plane
        run: pip install -e ".[dev]"
      - name: Render example workspace and plan (LocalStack)
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          DF_AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          # The per-run workspace generator (T016) renders terraform/workspaces/<run_id>/.
          # Until it exists, this job validates the pipeline wiring only.
          if python -c "import datafoundry.controlplane.engine.generator" 2>/dev/null; then
            python -m datafoundry.controlplane.engine.generator \
              --config platform-configs/examples/dev-aws-localstack.yaml \
              --out terraform/workspaces/ci-example
            cd terraform/workspaces/ci-example
            terraform init -backend=false
            terraform plan -detailed-exitcode -input=false
          else
            echo "generator not implemented yet — skipping plan render"
          fi

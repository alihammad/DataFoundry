[project]
name = "datafoundry-cli"
version = "0.1.0"
description = "DataFoundry CLI: deploy, validate, export, status, rollback lakehouse platforms"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
datafoundry = "datafoundry.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datafoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

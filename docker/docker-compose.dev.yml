# Local development dependencies for DataFoundry control plane.
# Usage: docker compose -f docker/docker-compose.dev.yml up -d
name: datafoundry-dev

services:
  postgres:
    image: postgres:15
    container_name: datafoundry-postgres
    environment:
      POSTGRES_USER: datafoundry
      POSTGRES_PASSWORD: datafoundry-dev-only
      POSTGRES_DB: datafoundry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datafoundry"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: datafoundry-localstack
    environment:
      SERVICES: s3,dynamodb,kms,sts
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  openmetadata:
    image: getopenmetadata/server:1.5.2
    container_name: datafoundry-openmetadata
    environment:
      OMDS_USER: datafoundry
      OMDS_USER_PASSWORD: datafoundry-dev-only
      DB_SCHEME: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: datafoundry
      DB_USER_PASSWORD: datafoundry-dev-only
      DB_PARAMS: "?allowPublicKeyRetrieval=true&useSSL=false"
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_RESPONSE_TYPE: id_token
    ports:
      - "8585:8585"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8585/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    container_name: datafoundry-ui
    environment:
      DF_DATABASE_URL: postgresql+psycopg://datafoundry:datafoundry-dev-only@postgres:5432/datafoundry
      DF_AUTH_MODE: dev
      DF_UI_STATIC_DIR: /app/ui/dist
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  localstack-data:

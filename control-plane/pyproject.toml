[project]
name = "datafoundry-controlplane"
version = "0.1.0"
description = "DataFoundry control plane: one-click governed lakehouse deployment on AWS/GCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25",
    "boto3>=1.34",
    "google-cloud-storage>=2.16",
    "google-auth>=2.29",
    "uvicorn[standard]>=0.30",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pyiceberg>=0.7",
    "cryptography>=42.0",
    "pymssql>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datafoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

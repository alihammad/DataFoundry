# Dev fault-injection config — quickstart Scenario 3.
# The control plane (dev mode only, DF_FAULT_INJECTION=1) forces the
# `orchestration` deployment step to fail so retry/rollback can be exercised.
apiVersion: datafoundry/v1
kind: PlatformConfig

platform:
  name: fault-injection-dev
  provider: aws
  region: us-east-1
  environment: development

capabilities:
  storage_zones: { enabled: true }
  networking: { enabled: true }
  iam: { enabled: true }
  secrets: { enabled: true }
  compute: { enabled: true, size: small }
  catalog: { enabled: true }
  orchestration: { enabled: true }
  ingestion: { enabled: true }
  quality: { enabled: false }
  semantic_layer: { enabled: false }
  monitoring: { enabled: true }

storage:
  table_format: iceberg
  zones:
    bronze: { retention_days: -1 }
    silver: { retention_days: 30 }
    gold: { retention_days: 30 }

encryption:
  at_rest:
    kms_key_ref: platform-cmk
    algorithm: AES-256
  in_transit:
    min_tls: "1.2"

networking:
  isolation: private
  cidr: 10.21.0.0/16

secrets:
  backend: aws_secrets_manager
  refs:
    platform-credentials: platform-credentials

observability:
  tracing: opentelemetry
  log_retention_days: 14

# Fault injection is a control-plane setting (dev mode only), not config:
#   DF_FAULT_INJECTION=1 DF_FAULT_INJECTION_STEP=orchestration
# The platform name `fault-injection-dev` scopes the injection to this deploy.
